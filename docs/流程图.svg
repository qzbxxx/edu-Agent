<text x="100" y="1516" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5b6b7c" text-anchor="start">状态：thread_id → agent_state.db；interrupt 后可用 POST /api/audit/resume 跨进程恢复。</text>
<text x="100" y="1542" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5b6b7c" text-anchor="start">记忆：画像全量注入；情景记忆按问题检索 Top3；与文档冲突时以文档为准。</text>
</svg>