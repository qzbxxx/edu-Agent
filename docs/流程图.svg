<text x="308" y="1481" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">退费链路</text>
<rect x="460" y="1466" width="18" height="18" rx="4" fill="#b8912f"/>
<text x="488" y="1481" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">判定节点</text>
<rect x="640" y="1466" width="18" height="18" rx="4" fill="#7b5ea7"/>
<text x="668" y="1481" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">人工审批</text>
