<rect x="1180" y="520" width="540" height="186" rx="12" fill="#fdf0ef" stroke="#b85c52" stroke-width="1.8"/>
<text x="1450.0" y="551" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">④&#x27; after_sales_agent_node</text>
<text x="1450.0" y="578" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">LLM 自主选择并调用工具</text>
<text x="1450.0" y="600" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">4 个订单：list / query / policy / submit</text>
<text x="1450.0" y="622" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">3 个记忆：get_profile / save / search</text>
<text x="1450.0" y="644" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6f5e" text-anchor="middle">画像进 System Prompt；最多 4 轮</text>
<text x="1450.0" y="666" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">明确退款未提交 → 确定性兜底</text>
