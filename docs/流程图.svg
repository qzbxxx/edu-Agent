<text x="1450.0" y="1102" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#243447" text-anchor="middle">interrupt() 挂起本轮，状态落盘</text>
<text x="1450.0" y="1121" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#243447" text-anchor="middle">POST /api/audit/resume 恢复</text>
<text x="1450.0" y="1140" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#6b5a2a" text-anchor="middle">驳回 → 写记忆 + END 驳回话术</text>
