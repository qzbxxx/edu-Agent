<text x="850.0" y="1113" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6b45" text-anchor="middle">「未通过人工审核」</text>
<path d="M 1450,1348 L 1450,1368" fill="none" stroke="#4f9464" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
