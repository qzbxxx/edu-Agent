<rect width="1840" height="1580" fill="#ffffff"/>
<text x="60" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="34" font-weight="bold" fill="#0f2b46" text-anchor="start">教育客服 Agent：一次提问从进入到回答的完整链路</text>
<text x="60" y="92" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="normal" fill="#5b6b7c" text-anchor="start">LangGraph 状态机 · 混合检索 RAG · 工具调用 · 人工审批 · 长期记忆</text>
<rect x="620" y="120" width="600" height="86" rx="12" fill="#eef4fa" stroke="#4a7fb5" stroke-width="1.8"/>
<text x="920" y="153" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#173a5e" text-anchor="middle">学员提问</text>
<text x="920" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#31577a" text-anchor="middle">CLI: interactive_cli.py ｜ HTTP: POST /api/chat</text>
<path d="M 920,206 L 920,246" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="620" y="246" width="600" height="92" rx="12" fill="#eef4fa" stroke="#4a7fb5" stroke-width="1.8"/>
<text x="920.0" y="277" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">① load_memory_node</text>
<text x="920.0" y="304" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">读画像 user_profiles（长期记忆库）</text>
<text x="920.0" y="326" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6f5e" text-anchor="middle">清空本轮 tool_events；画像写入 State</text>
<path d="M 920,338 L 920,370" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polygon points="920,370.0 1080.0,430 920,490.0 760.0,430" fill="#fff8e1" stroke="#b8912f" stroke-width="1.8"/>
<text x="920" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#4a3a12" text-anchor="middle">② router_node</text>
<text x="920" y="451" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#6b5a2a" text-anchor="middle">咨询还是退款？</text>
<path d="M 760,430 L 360,430 L 360,520" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="545" y="416" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#4a7fb5" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">consult</text>
<rect x="100" y="520" width="520" height="100" rx="12" fill="#eef4fa" stroke="#4a7fb5" stroke-width="1.8"/>
<text x="360.0" y="551" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">③ query_rewrite_node</text>
<text x="360.0" y="578" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">多轮消解代词（1000 token 窗口）</text>
<text x="360.0" y="600" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">首轮无指代 → 直通</text>
<path d="M 360,620 L 360,660" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="100" y="660" width="520" height="220" rx="12" fill="#eef4fa" stroke="#4a7fb5" stroke-width="1.8"/>
<text x="360.0" y="691" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">④ consult_rag_node</text>
<text x="360.0" y="718" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">BM25 + 向量各 Top10</text>
<text x="360.0" y="740" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">→ RRF 融合前 12 → 覆盖率精排 0.8 : 0.2</text>
<text x="360.0" y="762" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">→ 阈值 0.35 过滤 → 取 Top4</text>
<text x="360.0" y="784" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6f5e" text-anchor="middle">注入：学员画像 + Top3 情景记忆</text>
<text x="360.0" y="806" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">＋ 最近 5 条对话 → 生成答案</text>
<text x="360.0" y="828" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">无命中 → 固定话术转人工，不调模型</text>
<path d="M 360,880 L 360,915" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="100" y="915" width="520" height="104" rx="12" fill="#eef4fa" stroke="#4a7fb5" stroke-width="1.8"/>
<text x="360.0" y="946" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">⑤ memory_extractor_node</text>
<text x="360.0" y="973" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">抽取画像并合并写入</text>
<text x="360.0" y="995" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6f5e" text-anchor="middle">覆盖旧值 → 记 profile_change 事件</text>
<path d="M 360,1019 L 360,1054" fill="none" stroke="#4a7fb5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="100" y="1054" width="520" height="90" rx="12" fill="#eaf7ee" stroke="#4f9464" stroke-width="1.8"/>
<text x="360.0" y="1085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#1f5132" text-anchor="middle">END 咨询</text>
<text x="360.0" y="1117" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6b45" text-anchor="middle">答案 + 引用 [《文件》第 X 页]</text>
<path d="M 1080,430 L 1450,430 L 1450,520" fill="none" stroke="#b85c52" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
