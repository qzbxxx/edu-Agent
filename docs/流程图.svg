<text x="1450.0" y="1249" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#102a43" text-anchor="middle">⑥ execute_refund_node</text>
<text x="1450.0" y="1276" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">二次校验归属 → 预占 PROCESSING</text>
<text x="1450.0" y="1298" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#243447" text-anchor="middle">订单 REFUNDED → 标记 SUCCESS</text>
<text x="1450.0" y="1320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6f5e" text-anchor="middle">成功 → 写一条退款记忆</text>
<path d="M 1180,1109 L 1000,1109" fill="none" stroke="#b85c52" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<text x="1090" y="1095" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#b85c52" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">rejected</text>
