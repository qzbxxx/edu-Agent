<text x="1450.0" y="1399" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#1f5132" text-anchor="middle">END 退款</text>
<text x="1450.0" y="1431" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="normal" fill="#2f6b45" text-anchor="middle">退款成功，金额原路退回</text>
<rect x="100" y="1180" width="520" height="210" rx="12" fill="#f4faf7" stroke="#4f9d8a" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="360" y="1216" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#1f5132" text-anchor="middle">长期记忆库 long_term_memory.db</text>
<text x="360" y="1248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#2f5f50" text-anchor="middle">user_profiles：画像（目标 / 基础 / 偏好）</text>
<text x="360" y="1273" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#2f5f50" text-anchor="middle">user_memories：退款、笔记、画像变更事件</text>
<text x="360" y="1298" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#2f5f50" text-anchor="middle">读：load_memory / consult_rag / 售后工具</text>
<text x="360" y="1323" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#2f5f50" text-anchor="middle">写：memory_extractor / 退款节点 / save_memory</text>
<text x="360" y="1348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#2f5f50" text-anchor="middle">检索：0.65 词重合 + 0.25 新鲜度 + 0.10 重要性</text>
<rect x="100" y="1466" width="18" height="18" rx="4" fill="#4a7fb5"/>
<text x="128" y="1481" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="normal" fill="#4b5563" text-anchor="start">咨询链路</text>
